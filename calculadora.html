<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Simples</title>
</head>
<body>

    <h1>Calculadora</h1>

    <input type="number" id="num1" placeholder="Primeiro número">

    <select id="operacao">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Segundo número">

    <button onclick="calcular()">Calcular</button>

    <h2>Resultado: <span id="resultado"></span></h2>

    <script src="calculadora.js"></script>

</body>
</html>
